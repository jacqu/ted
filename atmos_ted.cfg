SYMBOLS {
    __PROGFLAG__:  type = weak, value = $80; 	# $00=BASIC, $80=machine code
    __AUTORUN__:   type = weak, value = $00; 	# $00=only load, $C7=run
    __GRAB__:      type = weak, value = 1; 		# 0=don't grab graphics RAM, 1=grab graphics RAM

    # Top of the memory, laid out by hand rather than taken from the
    # standard configuration, because TED can use one of the two
    # character sets of the machine and the standard one cannot know that.
    #
    # An Atmos keeps three things just under the top of its RAM: the text
    # screen, the alternate character set and the standard one. TED writes
    # on the screen and redefines one glyph of the standard set, but it
    # never switches to the alternate set, which leaves the 896 bytes of
    # it free.
    #
    # That is where the C stack is put. The stack has to live at the top
    # of the memory, since it grows downwards, and putting it in the
    # alternate set instead of below the character sets hands the whole
    # kilobyte it used to take back to the text.
    __SCREEN__:    type = weak, value = $BB80;	# Text screen
    __ALTCHARSET__: type = weak, value = $B800;	# Alternate character set, unused by TED
    __CHARSET__:   type = weak, value = $B400;	# Standard character set, one glyph redefined

    __STACKSIZE__: type = weak, value = __SCREEN__ - __ALTCHARSET__;
                                                # 896 bytes, the alternate character set
    __RAMEND__:    type = weak, value = __SCREEN__;
                                                # The C stack starts just below the screen
}
MEMORY {
    ZP:      file = "", define = yes, start = $005D,             size = $0028;
    MAIN:    file = %O, define = yes, start = __START_ADDRESS__, size = __RAMEND__ - __MAIN_START__;
    # The data stops below the standard character set, and not below the
    # stack as it normally would: the stack is no longer down here
    BSS:     file = "",               start = __ONCE_RUN__,      size = __CHARSET__ - __ONCE_RUN__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    STARTUP:  load = MAIN,    type = ro;
    CODE:     load = MAIN,    type = ro, align = $100;
    RODATA:   load = MAIN,    type = ro;
    DATA:     load = MAIN,    type = rw;
    INIT:     load = MAIN,    type = rw;
    ONCE:     load = MAIN,    type = ro,  define   = yes;
    BSS:      load = BSS,     type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
